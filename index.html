<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ⚠️ 본인의 실제 GAS 웹앱 URL 입력
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/YOUR_GAS_WEBAPP_ID/exec";
  
  const firebaseConfig = {
    databaseURL: "https://my-first-app-a9e3a-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const votesRef = ref(db, 'votes');

  // Firebase 실시간 리스너 (Firebase 데이터 변경 시 자동 그래프 업데이트)
  onValue(votesRef, (snapshot) => {
    const data = snapshot.val() || { optionA: 0, optionB: 0, optionC: 0 };
    renderChart(data);
  });

  // 투표 함수 (GitHub Pages -> GAS)
  window.castVote = function(selectedOption) {
    setLoading(true);

    // text/plain 형태로 보내야 외부 사이트(GitHub Pages)에서 CORS 에러 없이 GAS로 데이터가 전달됩니다.
    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ option: selectedOption })
    })
    .then(() => {
      // no-cors 특성상 전송 완료 후 약간의 시차를 두고 버튼 활성화
      setTimeout(() => setLoading(false), 500);
    })
    .catch((err) => {
      setLoading(false);
      console.error("투표 오류:", err);
    });
  };

  function renderChart(data) {
    const countA = data.optionA || 0;
    const countB = data.optionB || 0;
    const countC = data.optionC || 0;
    const total = countA + countB + countC;

    const percentA = total === 0 ? 0 : Math.round((countA / total) * 100);
    const percentB = total === 0 ? 0 : Math.round((countB / total) * 100);
    const percentC = total === 0 ? 0 : Math.round((countC / total) * 100);

    document.getElementById('barA').style.width = percentA + '%';
    document.getElementById('barB').style.width = percentB + '%';
    document.getElementById('barC').style.width = percentC + '%';

    document.getElementById('percentA').innerText = `${percentA}% (${countA}표)`;
    document.getElementById('percentB').innerText = `${percentB}% (${countB}표)`;
    document.getElementById('percentC').innerText = `${percentC}% (${countC}표)`;
    document.getElementById('totalVotes').innerText = `총 투표수: ${total}표`;
  }

  function setLoading(isLoading) {
    const btns = document.querySelectorAll('.btn');
    const loading = document.getElementById('loadingText');
    btns.forEach(b => b.disabled = isLoading);
    loading.style.display = isLoading ? 'block' : 'none';
  }
</script>
