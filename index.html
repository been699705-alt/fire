<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 투표/설문조사</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
    .poll-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 520px; }
    h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 24px; }
    
    .vote-btns { display: flex; gap: 10px; margin-bottom: 24px; }
    .btn { flex: 1; padding: 12px 8px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.2s ease; }
    .btn-a { background-color: #4f46e5; color: white; }
    .btn-a:hover { background-color: #4338ca; }
    .btn-b { background-color: #ec4899; color: white; }
    .btn-b:hover { background-color: #db2777; }
    .btn-c { background-color: #10b981; color: white; }
    .btn-c:hover { background-color: #059669; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-container { display: flex; flex-direction: column; gap: 18px; }
    .result-item { display: flex; flex-direction: column; gap: 6px; }
    .label-row { display: flex; justify-content: space-between; font-weight: 600; color: #4b5563; font-size: 14px; }
    
    /* CSS 바 차트 스타일 */
    .bar-bg { background-color: #e5e7eb; height: 22px; border-radius: 11px; overflow: hidden; width: 100%; }
    .bar-fill { height: 100%; width: 0%; border-radius: 11px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .bar-a { background-color: #6366f1; }
    .bar-b { background-color: #f43f5e; }
    .bar-c { background-color: #10b981; }
    
    .total-votes { text-align: right; color: #9ca3af; font-size: 13px; margin-top: 18px; font-weight: 500; }
    .loading { text-align: center; color: #6b7280; font-size: 14px; display: none; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="poll-card">
    <h2>실시간 투표 현황</h2>
    
    <div class="vote-btns">
      <button class="btn btn-a" onclick="castVote('optionA')">A안 선택</button>
      <button class="btn btn-b" onclick="castVote('optionB')">B안 선택</button>
      <button class="btn btn-c" onclick="castVote('optionC')">C안 선택</button>
    </div>

    <div id="loadingText" class="loading">투표 수 반영 중...</div>

    <div class="result-container">
      <div class="result-item">
        <div class="label-row">
          <span>A안</span>
          <span id="percentA">0% (0표)</span>
        </div>
        <div class="bar-bg">
          <div id="barA" class="bar-fill bar-a"></div>
        </div>
      </div>

      <div class="result-item">
        <div class="label-row">
          <span>B안</span>
          <span id="percentB">0% (0표)</span>
        </div>
        <div class="bar-bg">
          <div id="barB" class="bar-fill bar-b"></div>
        </div>
      </div>

      <div class="result-item">
        <div class="label-row">
          <span>C안</span>
          <span id="percentC">0% (0표)</span>
        </div>
        <div class="bar-bg">
          <div id="barC" class="bar-fill bar-c"></div>
        </div>
      </div>
    </div>

    <div class="total-votes" id="totalVotes">총 투표수: 0표</div>
  </div>

  <!-- Firebase JavaScript SDK (v10 모듈 사용) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ 사용자 설정 영역: GAS 웹앱 URL 및 Firebase 설정 입력
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/YOUR_GAS_WEBAPP_ID/exec";
    
    const firebaseConfig = {
      databaseURL: "https://my-first-app-a9e3a-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    // Firebase 초기화 및 Realtime Database 연결
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const votesRef = ref(db, 'votes');

    // 🔥 핵심: Firebase 데이터가 변경되는 즉시 새로고침 없이 바 차트 업데이트
    onValue(votesRef, (snapshot) => {
      const data = snapshot.val() || { optionA: 0, optionB: 0, optionC: 0 };
      renderChart(data);
    });

    // 투표 전송 함수 (GAS doPost 호출)
    window.castVote = function(selectedOption) {
      setLoading(true);

      fetch(GAS_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors", // GAS CORS 우회 설정
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ option: selectedOption })
      })
      .then(() => {
        setLoading(false);
      })
      .catch((err) => {
        setLoading(false);
        console.error("투표 오류:", err);
      });
    };

    // 차트 및 백분율 계산 UI 업데이트
    function renderChart(data) {
      const countA = data.optionA || 0;
      const countB = data.optionB || 0;
      const countC = data.optionC || 0;
      const total = countA + countB + countC;

      const percentA = total === 0 ? 0 : Math.round((countA / total) * 100);
      const percentB = total === 0 ? 0 : Math.round((countB / total) * 100);
      const percentC = total === 0 ? 0 : Math.round((countC / total) * 100);

      document.getElementById('barA').style.width = percentA + '%';
      document.getElementById('barB').style.width = percentB + '%';
      document.getElementById('barC').style.width = percentC + '%';

      document.getElementById('percentA').innerText = `${percentA}% (${countA}표)`;
      document.getElementById('percentB').innerText = `${percentB}% (${countB}표)`;
      document.getElementById('percentC').innerText = `${percentC}% (${countC}표)`;
      document.getElementById('totalVotes').innerText = `총 투표수: ${total}표`;
    }

    function setLoading(isLoading) {
      const btns = document.querySelectorAll('.btn');
      const loading = document.getElementById('loadingText');
      btns.forEach(b => b.disabled = isLoading);
      loading.style.display = isLoading ? 'block' : 'none';
    }
  </script>
</body>
</html>
